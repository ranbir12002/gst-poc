services:
  mongo:
    image: mongo:7
    container_name: gst-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: stateGst
    volumes:
      - mongo_data:/data/db
    # Exposed to the host so you can point MongoDB Compass / mongosh at it
    # from Windows for manual verification. Remove this if that's not needed.
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - gst-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
        REACT_APP_GEOJSON_URL: ${REACT_APP_GEOJSON_URL:-}
    container_name: gst-app
    restart: unless-stopped
    # base config (JWT secret, Google Maps key, etc.) still comes from
    # backend/.env; MONGO_URI below overrides it to point at the mongo
    # container instead of the Atlas URI that's currently in that file.
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/stateGst?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Bind-mount the raw source data so CSV/geojson files can be dropped
      # in from Windows and picked up by the migrate_*/upload_* scripts
      # (they read from ../new_data relative to backend/). Not baked into
      # the image because full_data.csv alone is ~300MB and these files
      # change independently of app code.
      - ./new_data:/app/new_data
    expose:
      - "5000"
    networks:
      - gst-net

  nginx:
    image: nginx:alpine
    container_name: gst-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gst-net

networks:
  gst-net:
    driver: bridge

volumes:
  mongo_data:
